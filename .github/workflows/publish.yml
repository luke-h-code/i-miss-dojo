name: Generate and publish

on:
  schedule:
    # Wednesday 8am UK. GitHub cron is UTC-only, so fire at both 07:00 UTC
    # (8am BST, summer) and 08:00 UTC (8am GMT, winter). The script works out
    # which one is really 8am in London and skips the other.
    - cron: "0 7 * * 3"
    - cron: "0 8 * * 3"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate:
        description: "Generate a new post now (ignores the Wednesday 8am check)"
        type: boolean
        default: false
      photos:
        description: "Add photos to the latest post (if it has none)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate this week's post
        if: github.event_name == 'schedule' || inputs.generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          FORCE: ${{ inputs.generate && 'true' || 'false' }}
        run: npm run generate

      - name: Add photos to the latest post
        if: inputs.photos
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run images -- "posts/$(ls posts | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -1)"

      - name: Commit new post
        if: github.event_name == 'schedule' || inputs.generate || inputs.photos
        run: |
          git add posts
          if git diff --cached --quiet; then
            echo "No new post."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "${{ inputs.photos && !inputs.generate && 'Add photos for' || 'Add post for' }} $(TZ=Europe/London date +%F)"
            git push
          fi

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
